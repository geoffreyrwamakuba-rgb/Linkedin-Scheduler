name: LinkedIn Post Dispatcher

on:
  schedule:
    # every 15 min, offset from round numbers (07,22,37,52 past), 07:00-19:00 UTC
    # (~8:00-20:00 London). Round-number crons (":00") queue behind every other repo's
    # top-of-hour jobs on GitHub's side and can drift badly (a scheduled post once sat
    # "pending" ~1.5h past due, 2026-07-27, before a check finally ran) - offsetting
    # avoids that congestion, and checking 4x/hour instead of 1x/hour means one missed
    # check no longer costs a full hour of drift. Actions minutes are unlimited for
    # this repo so the extra runs cost nothing.
    - cron: "7,22,37,52 7-19 * * *"
  workflow_dispatch: {}       # manual trigger for testing

concurrency:
  group: linkedin-dispatch    # never two runs at once (double-post guard)
  cancel-in-progress: false

permissions:
  contents: write             # to commit queue.json status updates

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run dispatcher
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_MEMBER_URN: ${{ secrets.LINKEDIN_MEMBER_URN }}
        run: python dispatcher.py

      - name: Commit status updates
        run: |
          if ! git diff --quiet queue.json; then
            git config user.name "dispatcher-bot"
            git config user.email "actions@github.com"
            git add queue.json
            git commit -m "dispatcher: update post statuses"
            git push
          fi
